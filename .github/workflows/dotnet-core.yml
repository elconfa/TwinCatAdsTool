name: .NET Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --no-restore --verbosity normal

  # Releases are cut from a tag, never from a push. The version comes from the tag itself, so
  # what the release is called, what the binary reports and what the window shows are one number.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Version from the tag
      id: version
      shell: pwsh
      run: echo "value=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT

    # Needs the .NET 8 desktop runtime on the target machine, and is small.
    - name: Publish framework dependent
      run: >
        dotnet publish TwinCatAdsTool\TwinCatAdsTool.csproj -c Release -r win-x64
        --self-contained false /p:Version=${{ steps.version.outputs.value }} -o out\framework-dependent

    # Carries its own runtime: nothing to install on the cabinet pc.
    - name: Publish self contained
      run: >
        dotnet publish TwinCatAdsTool\TwinCatAdsTool.csproj -c Release -r win-x64
        --self-contained true /p:PublishReadyToRun=true
        /p:Version=${{ steps.version.outputs.value }} -o out\self-contained

    - name: Package
      shell: pwsh
      run: |
        $v = '${{ steps.version.outputs.value }}'
        Compress-Archive -Path out\framework-dependent\TwinCatAdsTool.exe, out\framework-dependent\log.config -DestinationPath "TwinCatAdsTool-$v-win-x64.zip"
        Compress-Archive -Path out\self-contained\TwinCatAdsTool.exe, out\self-contained\log.config -DestinationPath "TwinCatAdsTool-$v-win-x64-selfcontained.zip"

    - name: Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create '${{ github.ref_name }}' --title '${{ github.ref_name }}' --generate-notes (Get-Item *.zip).Name
