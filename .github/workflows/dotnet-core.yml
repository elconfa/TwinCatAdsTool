name: .NET Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --no-restore --verbosity normal

  # Releases are cut from a tag, never from a push. The version comes from the tag itself, so
  # what the release is called, what the binary reports and what the window shows are one number.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # the tag annotation is the release body, so the tags have to come along
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Version from the tag
      id: version
      shell: pwsh
      run: echo "value=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT

    # Needs the .NET 8 desktop runtime on the target machine, and is small.
    - name: Publish framework dependent
      run: >
        dotnet publish TwinCatAdsTool\TwinCatAdsTool.csproj -c Release -r win-x64
        --self-contained false /p:Version=${{ steps.version.outputs.value }} -o out\framework-dependent

    # Carries its own runtime: nothing to install on the cabinet pc.
    - name: Publish self contained
      run: >
        dotnet publish TwinCatAdsTool\TwinCatAdsTool.csproj -c Release -r win-x64
        --self-contained true /p:PublishReadyToRun=true
        /p:Version=${{ steps.version.outputs.value }} -o out\self-contained

    - name: Package
      shell: pwsh
      run: |
        $v = '${{ steps.version.outputs.value }}'
        Compress-Archive -Path out\framework-dependent\TwinCatAdsTool.exe, out\framework-dependent\log.config, out\framework-dependent\TwinCatAdsTool-Manual.pdf -DestinationPath "TwinCatAdsTool-$v-win-x64.zip"
        Compress-Archive -Path out\self-contained\TwinCatAdsTool.exe, out\self-contained\log.config, out\self-contained\TwinCatAdsTool-Manual.pdf -DestinationPath "TwinCatAdsTool-$v-win-x64-selfcontained.zip"

    # The release notes are the annotation of the tag itself, so what is released, what it is
    # called and what it says it changed all come from one place. --generate-notes only produces
    # a list of commit subjects, which is not what someone deciding whether to upgrade needs.
    #
    # The fetch and the check are not caution for its own sake. actions/checkout leaves the tag
    # behind as a lightweight ref, and %(contents) of a lightweight tag is the message of the
    # *commit* it points at - so the annotation was quietly replaced by the commit message, and
    # 1.6.0 went out with a commit message as its release notes. Fetching brings the tag object
    # itself across; the check refuses to publish rather than fall back a second time.
    - name: Release notes from the tag
      shell: pwsh
      run: |
        git fetch --force --tags origin
        $kind = git cat-file -t 'refs/tags/${{ github.ref_name }}'
        if ($kind -ne 'tag') {
          throw "refs/tags/${{ github.ref_name }} is a $kind, not an annotated tag. The release notes are the tag annotation, so there would be nothing to publish but the commit message. Tag with 'git tag -a'."
        }
        git tag -l --format='%(contents)' '${{ github.ref_name }}' | Out-File -Encoding utf8 release-notes.md

    - name: Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create '${{ github.ref_name }}' --title '${{ github.ref_name }}' --notes-file release-notes.md (Get-Item *.zip).Name
